version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: datacontractor
      POSTGRES_PASSWORD: datacontractor
      POSTGRES_DB: datacontractor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datacontractor"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://datacontractor:datacontractor@postgres:5432/datacontractor
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  dashboard:
    build: .
    command: streamlit run app/dashboard/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://datacontractor:datacontractor@postgres:5432/datacontractor
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
